[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nta-runtime"
version = "0.1.0"
description = "Python engine bindings for finite-kernel nonresident acquisition"
requires-python = ">=3.10"

[project.optional-dependencies]
# The adapters are deliberately version-pinned.  They bind framework-private
# batch layouts and therefore must not silently run against an unqualified
# distribution.  Keep the base package engine-neutral and install one
# framework extra for a single-engine deployment.  The validated dual-engine
# profile is documented separately because the upstream wheels currently pin
# incompatible transitive helper versions.
sglang = [
    "sglang==0.5.16",
    "sglang-kernel==0.4.5",
    "flashinfer-python==0.6.14",
]
vllm = [
    "vllm==0.26.0",
    # vLLM 0.26.0 is tested with the same Torch/FlashInfer core as the
    # SGLang profile below; see docs/ENGINE_INTEGRATION.md for dual-engine
    # provisioning and its explicit upstream dependency conflict.
    "flashinfer-python==0.6.14",
]

[project.entry-points."sglang.srt.plugins"]
nta = "nta_runtime.plugins.sglang:register"

[project.entry-points."vllm.general_plugins"]
nta = "nta_runtime.plugins.vllm:register"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
